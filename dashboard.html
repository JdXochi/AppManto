<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Control de Mantenimiento Xochi</title>
<style>
  :root{ --navy:#1F3864; --navy-dark:#152A4D; --ink:#1C2430; --paper:#F6F7F9; --card:#FFFFFF; --line:#E1E5EA; --muted:#6B7280; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header{ background:var(--navy); color:#fff; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1{ font-size:17px; margin:0; }
  header .who{ font-size:13px; color:#C9D6EA; }
  button.logout{ background:none; border:1px solid #6FA8DC; color:#fff; padding:7px 14px; border-radius:6px; font-size:12.5px; cursor:pointer; }
  button.logout:hover{ background:rgba(255,255,255,.1); }
  main{ max-width:720px; margin:0 auto; padding:32px 20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:24px; }
  .role-pill{ display:inline-block; padding:4px 12px; border-radius:20px; font-size:12.5px; font-weight:700; background:#EEF3FA; color:var(--navy); }
  .muted{ color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>

<header>
  <h1>Control de Mantenimiento de Equipos</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="who" id="who">Cargando...</span>
    <button class="logout" id="btn-logout">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="card">
    <p class="muted" style="margin-top:0">✅ Conexión con Supabase funcionando</p>
    <h2 id="saludo" style="margin:0 0 6px">Bienvenido</h2>
    <p>Tu rol: <span class="role-pill" id="rol-pill">—</span></p>
    <p class="muted">Este es un panel de prueba. Aquí construiremos las pantallas de Registrar, Inventario, Estado y Historial, conectadas a la base de datos real.</p>
  </div>
</main>

<script type="module">
  import { supabase, requireSession, getPerfilActual, cerrarSesion } from "./js/supabaseClient.js";

  const session = await requireSession();
  if (session) {
    const perfil = await getPerfilActual();
    if (perfil) {
      document.getElementById("who").textContent = `${perfil.nombre} (@${perfil.username || "—"})`;
      document.getElementById("saludo").textContent = `Bienvenido, ${perfil.nombre.split(" ")[0]}`;
      document.getElementById("rol-pill").textContent = perfil.rol;
    } else {
      document.getElementById("who").textContent = "Perfil no encontrado";
    }
  }

  document.getElementById("btn-logout").addEventListener("click", cerrarSesion);
</script>

</body>
</html>
