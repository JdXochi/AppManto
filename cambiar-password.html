<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña — Control de Mantenimiento Xochi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14406D; --navy-dark:#0F3357; --brand-blue:#1F97D4;
    --g1:#0B8F47; --g2:#DA1769; --g3:#2A80C1; --g4:#F06E21;
    --ink:#14202E; --muted:#66707C; --line:#E4E9EE;
    --red-bg:#FCE8E8; --red-txt:#B42318;
    --green-bg:#E4F5EB; --green-txt:#0B7A3E;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink); font-family:"Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--navy);
    background-image: repeating-linear-gradient(-35deg, rgba(255,255,255,.05) 0 2px, transparent 2px 34px);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; left:0; right:0; bottom:0; height:10px;
    background: linear-gradient(90deg, var(--g1) 0 25%, var(--g2) 25% 50%, var(--g3) 50% 75%, var(--g4) 75% 100%);
  }
  .card{
    background:#fff; border-radius:16px; width:100%; max-width:400px;
    padding:38px 34px 30px; box-shadow: 0 24px 60px rgba(4,20,40,.35);
    position:relative; z-index:1;
  }
  .logo-wrap{ display:flex; justify-content:center; margin-bottom:6px; }
  .logo-wrap img{ height:40px; width:auto; }
  .lanes{ display:flex; gap:4px; height:5px; border-radius:4px; overflow:hidden; margin:16px 0 20px; }
  .lanes span{ flex:1; }
  .lanes .g1{ background:var(--g1); } .lanes .g2{ background:var(--g2); }
  .lanes .g3{ background:var(--g3); } .lanes .g4{ background:var(--g4); }

  h1{ font-size:16px; margin:0 0 6px; color:var(--navy); font-weight:700; text-align:center; }
  p.sub{ font-size:13px; color:var(--muted); margin:0 0 20px; text-align:center; line-height:1.5; }

  label{ display:block; font-size:12.5px; font-weight:700; color:#3D4451; margin-bottom:6px; margin-top:16px; }
  input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#F8FAFB; color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--brand-blue); background:#fff; box-shadow:0 0 0 3px rgba(31,151,212,.15); }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:5px; }

  button.primary{
    width:100%; background:var(--navy); color:#fff; border:none; padding:13px;
    border-radius:10px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    margin-top:24px;
  }
  button.primary:hover{ background:var(--navy-dark); }
  button.primary:disabled{ background:#9AA7B4; cursor:not-allowed; }

  a.volver{ display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--muted); text-decoration:none; }
  a.volver:hover{ color:var(--navy); text-decoration:underline; }

  .msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin-top:18px; display:none; font-weight:600; }
  .msg.error{ background:var(--red-bg); color:var(--red-txt); }
  .msg.ok{ background:var(--green-bg); color:var(--green-txt); }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap"><img src="xochi-logo.png" alt="Xochi"></div>
  <div class="lanes"><span class="g1"></span><span class="g2"></span><span class="g3"></span><span class="g4"></span></div>

  <h1 id="titulo">Cambiar contraseña</h1>
  <p class="sub" id="subtitulo">Elige una nueva contraseña para tu cuenta.</p>

  <form id="form-password">
    <label for="password1">Nueva contraseña</label>
    <input type="password" id="password1" autocomplete="new-password" required minlength="8">
    <p class="hint">Mínimo 8 caracteres.</p>

    <label for="password2">Confirmar nueva contraseña</label>
    <input type="password" id="password2" autocomplete="new-password" required minlength="8">

    <div class="msg" id="msg"></div>

    <button type="submit" class="primary" id="btn-guardar">Guardar nueva contraseña</button>
  </form>

  <a href="dashboard.html" class="volver" id="link-volver" style="display:none">Volver al panel sin cambiarla</a>
</div>

<script type="module">
  import { supabase, requireSession, getPerfilActual, marcarPasswordCambiada } from "./js/supabaseClient.js";

  // No aplicamos el chequeo normal de requireSession aquí -- si lo hiciéramos,
  // alguien con debe_cambiar_password=true rebotaría de vuelta a esta misma
  // página en un ciclo. Esta página es precisamente adonde ese chequeo manda.
  const session = await requireSession({ skipPasswordCheck: true });
  if (session) {
    const perfil = await getPerfilActual();
    const esObligatorio = perfil && perfil.debe_cambiar_password;
    if (esObligatorio) {
      document.getElementById("titulo").textContent = "Por seguridad, actualiza tu contraseña";
      document.getElementById("subtitulo").textContent = "Antes de continuar, crea una nueva contraseña para tu cuenta.";
    } else {
      document.getElementById("link-volver").style.display = "block";
    }
  }

  const form = document.getElementById("form-password");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn-guardar");

  function mostrarMsg(texto, tipo) {
    msg.textContent = texto;
    msg.className = "msg " + tipo;
    msg.style.display = "block";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.style.display = "none";

    const p1 = document.getElementById("password1").value;
    const p2 = document.getElementById("password2").value;

    if (p1.length < 8) { mostrarMsg("La contraseña debe tener al menos 8 caracteres.", "error"); return; }
    if (p1 !== p2) { mostrarMsg("Las contraseñas no coinciden.", "error"); return; }

    btn.disabled = true; btn.textContent = "Guardando...";

    const { error: errorPass } = await supabase.auth.updateUser({ password: p1 });
    if (errorPass) {
      mostrarMsg("No se pudo actualizar la contraseña: " + errorPass.message, "error");
      btn.disabled = false; btn.textContent = "Guardar nueva contraseña";
      return;
    }

    try { await marcarPasswordCambiada(); } catch (err) { console.error(err); }

    mostrarMsg("Contraseña actualizada. Entrando al panel...", "ok");
    setTimeout(() => window.location.href = "dashboard.html", 1200);
  });
</script>

</body>
</html>
